name: beidou-pilot-dev

services:
  beidou-db:
    image: mysql:8.4.0
    labels:
      beidou.workbench.environment: dev
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      - -uroot
      - -proot
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  beidou-server-all:
    image: ghcr.io/beidoums/beidou-server-all:v1.12
    labels:
      beidou.workbench.environment: dev
    depends_on:
      beidou-db:
        condition: service_healthy
    environment:
      BEIDOU_DEV_ADMIN_PASSWORD: 123456
      TZ: Asia/Shanghai
    working_dir: /opt/server_backup
    entrypoint: [/bin/sh, /run/beidou-dev/start.sh]
    stop_grace_period: 2m
    volumes:
      - type: bind
        source: ${BEIDOU_DEV_CLI_JAR:?set the absolute path to the official management CLI JAR}
        target: /run/beidou-dev/beidou-cli.jar
        read_only: true
        bind:
          create_host_path: false
    configs:
      - source: application
        target: /run/beidou-dev/application.yml
      - source: start
        target: /run/beidou-dev/start.sh
      - source: cli
        target: /run/beidou-dev/cli.sh
    healthcheck:
      # Match listening sockets without opening dummy game sessions.
      test: [CMD, awk, '$$4 == "0A" {split($$2,a,":"); p[a[2]]=1} END {exit !(p["2124"] && p["1D97"] && p["21EE"])}', /proc/net/tcp, /proc/net/tcp6]
      interval: 5s
      timeout: 5s
      retries: 36

configs:
  application:
    file: ./application.yml
  start:
    file: ./start.sh
  cli:
    file: ./cli.sh
