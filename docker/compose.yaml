name: beidou-pilot-gui

services:
  client:
    container_name: ${CLIENT_CONTAINER_NAME:?需要实例专属容器名}
    image: ${CLIENT_IMAGE:?需要启动器选择的固定版本 GUI 镜像}
    build:
      context: ..
      dockerfile: docker/gui/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unversioned}
    pull_policy: never
    init: true
    restart: "no"
    stop_grace_period: 10s
    shm_size: 256mb
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.route_localnet: "1"
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      TARGET_IP: ${TARGET_IP:?请通过 beidou-pilot 核验并选择隔离目标}
      TARGET_CONTAINER_ID: ${TARGET_CONTAINER_ID:?需要已核验的目标容器身份}
      CLIENT_IMAGE_ID: ${CLIENT_IMAGE_ID:?需要已选择的 GUI 镜像 ID}
      RENDER_GID: ${RENDER_GID:?需要渲染设备的宿主组 ID}
      RUN_ID: ${RUN_ID:?请通过 beidou-pilot 创建运行会话}
      MAPLE_INSTANCE: ${MAPLE_INSTANCE:-default}
      MAPLE_LOGIN_MODE: ${MAPLE_LOGIN_MODE:-character}
      CLIENT_ROOT: ${CLIENT_RUNTIME_ROOT:?需要容器内实例目录}
      MAPLE_RESOURCES_CONFIG: ${CLIENT_RUNTIME_ROOT:?需要容器内实例目录}/config/resources.json
      WINEPREFIX: ${CLIENT_RUNTIME_ROOT:?需要容器内实例目录}/runtime/prefix
      WINEDEBUG: ${WINEDEBUG:--all}
      BEIDOU_WORKBENCH_ID: ${BEIDOU_WORKBENCH_ID:?需要工作目录身份}
      MODEL_PROXY_IP: ${MODEL_PROXY_IP:-}
      MODEL_PROXY_PORT: ${MODEL_PROXY_PORT:-}
      HTTP_PROXY: ${MODEL_PROXY:-}
      HTTPS_PROXY: ${MODEL_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,${TARGET_IP}
    labels:
      beidou.task: client-v17-maintained
      beidou.client.root: ${CLIENT_ROOT:?需要 CLI 运行根目录}
      beidou.client.instance: ${MAPLE_INSTANCE:-default}
      beidou.workbench: ${WORKBENCH_ROOT:?需要工作台绝对路径}
      beidou.target.id: ${TARGET_CONTAINER_ID:?需要已核验的目标容器身份}
      beidou.character.id: ${CHARACTER_ID:-}
      beidou.world: ${WORLD_ID:?需要角色大区索引}
    networks:
      - target
    volumes:
      - type: bind
        source: ${BEIDOU_CLIENT_DIR:?需要原客户端目录}
        target: /client
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GAME_DATA_DIR:?需要原版 Data/IMG 目录}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WORKBENCH_ROOT:?需要工作台绝对路径}
        target: /work
        bind:
          create_host_path: false

networks:
  target:
    external: true
    name: ${TARGET_NETWORK:?需要已核验的隔离网络}
