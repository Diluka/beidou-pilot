schemaVersion: 1
map:
  id: character-care
  title: 角色维护
  summary: 原版 GUI 的装备、复活与快捷键维护，按实际变化核对结果；Lua 动作意图归动作领域。
nodes:
  - id: character-care
    kind: domain
    name: 角色维护
    summary: 为操作者在原版 GUI 中提供背包换装、死亡复活和快捷键绑定，并核对可观察变化；不替调用方选择养成路线，也不提供 AP/SP 自动分配或药品命令。
    aliases: [角色经营, 角色维护, 养成]
    anchors:
      - kind: document
        value: docs/CLI.md
        description: 装备、复活和快捷键的当前使用契约。
      - kind: document
        value: docs/CLIENT_LIMITATIONS.md
        description: 当前能力边界与已退役的自动养成入口。
  - id: character-care.equip
    kind: operation
    name: 在 GUI 背包中更换装备
    summary: 通过原版背包界面点击更换指定装备，随后读取已装备槽位确认物品；无头与 Lua 不提供该语义入口。
    aliases: [equip, 换装]
    anchors:
      - kind: file
        value: cli/beidou_pilot/items.py
        description: 装备工作流与背包点击换装。
      - kind: document
        value: docs/CLI.md
        description: equip 的 GUI 支持范围。
  - id: character-care.bind
    kind: operation
    name: 配置物品或技能快捷键
    summary: 通过当前可见背包或已学技能拖放到已定位快捷栏，读回绑定表并确认拖拽结束；原生白名单与布局限制明确拒绝。
    aliases: [快捷键绑定, bind]
    anchors:
      - kind: file
        value: cli/beidou_pilot/hotkeys.py
        description: 快捷键读取、拖放绑定与原生键位表核对。
      - kind: document
        value: docs/CLI.md
        description: hotkeys/bind 的命令边界。
  - id: character-care.revive
    kind: scenario
    name: 确认死亡角色恢复
    summary: 存活直接跳过；死亡时只在唯一已识别确认框点击一次，核对同角色 HP 为正且位置可用。
    aliases: [复活, revive]
    anchors:
      - kind: file
        value: cli/beidou_pilot/cli.py
        description: revive 命令的 GUI 分派与无头明确拒绝。
      - kind: document
        value: docs/CLI.md
        description: 复活的前提、一次确认和结果核对。
  - id: character-care.confirmation
    kind: invariant
    name: 以实际变化确认角色维护结果
    summary: 换装核对槽位，复活核对同角色状态；派发成功或窗口变化不能替代效果确认。
    aliases: [槽位确认, 恢复确认]
    anchors:
      - kind: file
        value: cli/beidou_pilot/snapshot.py
        description: 观察当前角色、背包、装备与位置用于结果核对。
      - kind: document
        value: docs/CLI.md
        description: 各维护动作的结果核对边界。
  - id: character-care.support-boundary
    kind: invariant
    name: 角色维护入口限于原版 GUI
    summary: 装备、复活与快捷键是 GUI CLI 的现有能力；无头端明确拒绝，Lua 只保留动作槽意图，不提供窗口、加点或药品命令。
    aliases: [GUI专属, 能力边界]
    anchors:
      - kind: document
        value: docs/ARCHITECTURE.md
        description: 两端能力与命令支持范围。
      - kind: document
        value: docs/CLIENT_LIMITATIONS.md
        description: 当前能力缺口与已退役入口。
relations:
  - {from: character-care.equip, type: part_of, to: character-care, summary: 装备更换归角色维护。}
  - {from: character-care.bind, type: part_of, to: character-care, summary: 快捷键绑定归角色维护。}
  - {from: character-care.revive, type: part_of, to: character-care, summary: 死亡复活归角色维护。}
  - {from: character-care.confirmation, type: part_of, to: character-care, summary: 角色维护结果以实际变化确认。}
  - {from: character-care.support-boundary, type: part_of, to: character-care, summary: 角色维护明确 GUI 专属支持范围。}
  - {from: character-care.equip, type: reads, to: game-observation.facts, summary: 比较装备背包和已装备槽位。}
  - {from: character-care.bind, type: reads, to: game-observation.facts, summary: 读取真实快捷键表确认目标绑定。}
  - {from: character-care.revive, type: invokes, to: game-observation.observe, summary: 核对已识别确认框与同角色恢复状态。}
  - {from: character-care.revive, type: reads, to: game-observation.facts, summary: 复活前后读取角色 HP 与位置。}
  - {from: character-care.equip, type: constrained_by, to: character-care.confirmation, summary: 指定物品须出现在已装备槽位。}
  - {from: character-care.bind, type: constrained_by, to: character-care.confirmation, summary: 绑定结果以重新读取的键位表为准。}
  - {from: character-care.revive, type: constrained_by, to: character-care.confirmation, summary: 一次确认后等待同角色恢复，未确认不重放。}
  - {from: character-care, type: constrained_by, to: character-care.support-boundary, summary: 按本端实际支持范围选择维护操作。}
flows:
  - id: character-care.revive.flow
    name: 一次确认并等待角色恢复
    summary: 存活跳过，死亡时仅操作已识别确认框，不重复提交。
    scenario: character-care.revive
    startsAt: read
    steps:
      - {id: read, kind: action, name: 读取当前角色状态, summary: 要求角色及其原生读数可用。, concept: character-care.revive}
      - {id: alive, kind: decision, name: 角色是否存活, summary: 检查当前 HP 是否为正。}
      - {id: skip, kind: outcome, name: 角色已存活, summary: 无需复活，changed=false。}
      - {id: window, kind: decision, name: 死亡确认框能否唯一识别, summary: 等待已识别窗口并核对唯一确认按钮和已验布局。}
      - {id: refused, kind: outcome, name: 未发送复活确认, summary: 角色读数或确认窗口不能用于本次操作。}
      - {id: confirm, kind: action, name: 点击一次确认, summary: 只向已识别复活窗口提交一次确认。, concept: character-care.revive}
      - {id: restored, kind: decision, name: 同角色是否恢复, summary: 在期限内核对同一角色 HP 为正且位置可用。}
      - {id: done, kind: outcome, name: 复活已确认, summary: 返回恢复后的本端状态。}
      - {id: unknown, kind: outcome, name: 恢复未确认, summary: 身份变化或恢复未确认时停止，不重复点击。}
    transitions:
      - {from: read, to: alive}
      - {from: alive, to: skip, when: 角色存活}
      - {from: alive, to: window, when: 角色死亡}
      - {from: window, to: refused, when: 窗口或布局未确认}
      - {from: window, to: confirm, when: 唯一已识别确认框可用}
      - {from: confirm, to: restored}
      - {from: restored, to: done, when: 同角色恢复已确认}
      - {from: restored, to: unknown, when: 身份变化或恢复未确认}
