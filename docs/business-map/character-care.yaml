schemaVersion: 1
map:
  id: character-care
  title: 角色养成与恢复
  summary: 明确目标的加点、装备、药品、复活与快捷键维护。
nodes:
- id: character-care
  kind: domain
  name: 角色养成与恢复
  summary: 按调用方明确目标进行角色加点、装备、恢复、复活与快捷键配置，并核对可观察变化；不替调用方选择长期养成路线。
  aliases:
  - 角色经营
  - 角色维护
  anchors:
  - kind: document
    value: docs/CLI.md
    description: 养成、装备、药品和复活的当前使用契约。
- id: character-care.growth
  kind: capability
  name: 指定角色养成
  summary: 依据指定属性、技能和装备执行 GUI 操作，核对实际点数或装备变化。
  aliases: []
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/stats.py
    value: allocate_ap
    description: 逐点核对 AP 和目标属性。
  - kind: symbol
    file: cli/beidou_pilot/stats.py
    value: allocate_sp
    description: 逐点核对 SP 和已学技能等级。
- id: character-care.restoration
  kind: capability
  name: 资源恢复与死亡处理
  summary: 按库存、HP/MP 目标和支持的恢复品进行有界使用，死亡时通过已识别 GUI 确认恢复。
  aliases: []
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/items.py
    value: use
    description: 按物品种类选择恢复或传送路径并核对效果。
  - kind: symbol
    file: cli/beidou_pilot/recovery.py
    value: revive
    description: 只在已识别复活确认窗口点击一次并核对恢复。
- id: character-care.allocate
  kind: scenario
  name: 按指定目标分配 AP 或 SP
  summary: 每分配一点同时确认剩余点数减一与指定属性或技能等级加一；读数、技能列表或窗口定位未确认则停止。
  aliases:
  - 加点
  - stats
  - skills
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/stats.py
    value: allocate_ap
    description: 以剩余 AP 和目标属性双重读数确认每点分配。
  - kind: symbol
    file: cli/beidou_pilot/stats.py
    value: allocate_sp
    description: 以剩余 SP 和完整技能记录确认每点分配。
- id: character-care.equip
  kind: operation
  name: 更换指定装备并读回
  summary: 已装备时无操作返回；否则从普通背包装备，在已装备负槽位确认指定物品。
  aliases: []
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/items.py
    value: equip
    description: 正常背包操作后确认指定装备出现在已装备槽位。
- id: character-care.recover
  kind: scenario
  name: 按次数或目标使用恢复品
  summary: 两端普通 200 类药品通过共享 Lua 原生用药，逐次确认库存恰减一及所需 HP/MP 增长；其他已支持恢复品与单张传送卷保留 GUI 背包路径。
  aliases:
  - 用药
  - use
  - 恢复HP
  - 恢复MP
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/items.py
    value: use
    description: 选择支持的物品与路径，投影消耗、恢复或传送确认结果。
  - kind: file
    value: shared/scripts/recovery/recover.lua
    description: 普通 200 类药品按当前身份和库存逐次确认消耗与恢复。
- id: character-care.revive
  kind: scenario
  name: 确认死亡角色恢复
  summary: 存活直接跳过；死亡时只在唯一已识别确认框点击一次，核对同角色 HP 为正且位置可用。
  aliases:
  - 复活
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/recovery.py
    value: revive
    description: 等待已识别死亡确认窗口并核对同角色恢复，不重复点击。
- id: character-care.bind
  kind: operation
  name: 配置物品或技能快捷键
  summary: 通过当前可见背包或已学技能拖放到已定位快捷栏，读回绑定表并确认拖拽结束；原生白名单与布局限制明确拒绝。
  aliases:
  - 快捷键绑定
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/hotkeys.py
    value: _bind
    description: 通过正常拖放设置绑定并读取原生键位表确认。
- id: character-care.press
  kind: operation
  name: 使用已有快捷键
  summary: 读取真实绑定并通过 Lua 发送一次普通按键，仅报告已派发；消耗或技能效果由对应业务观察确认。
  aliases: []
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/hotkeys.py
    value: press_bound
    description: 读取已绑定按键并显式返回 effect_confirmed=false。
- id: character-care.specified-growth
  kind: invariant
  name: 养成目标由调用方明确指定
  summary: 工具按指定属性、技能、装备与数量执行；不自动制定职业路线或转职，不将未确认的分配作为可安全重试操作。
  aliases: []
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/stats.py
    value: allocate_ap
    description: 按调用方指定属性和数量逐点执行。
  - kind: symbol
    file: cli/beidou_pilot/stats.py
    value: allocate_sp
    description: 按调用方指定技能和数量逐点执行。
  - kind: document
    value: AGENTS.md
    description: 授权角色、不可逆养成及真实结果的操作约定。
- id: character-care.confirmation
  kind: invariant
  name: 以实际变化确认角色维护结果
  summary: 加点核对点数与目标值，装备核对槽位，用药核对消耗与所需恢复，复活核对同角色状态；派发成功不能替代效果。
  aliases: []
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/items.py
    value: use
    description: 物品已消耗但恢复或转场未确认时停止后续使用。
  - kind: symbol
    file: cli/beidou_pilot/stats.py
    value: allocate_ap
    description: 点数与目标属性必须同时符合预期。
- id: character-care.support-boundary
  kind: invariant
  name: 恢复共享而养成窗口限于 GUI
  summary: 普通 200 类药品两端共享 Lua；无头仅支持此类药品，AP/SP、装备、复活和快捷键配置仍是原版 GUI 流程。按 HP/MP 目标使用需已知恢复类型。
  aliases: []
  anchors:
  - kind: symbol
    file: cli/beidou_pilot/items.py
    value: use
    description: 拒绝无头非普通药品及恢复类型未知的 HP/MP 目标。
  - kind: symbol
    file: cli/beidou_pilot/cli.py
    value: dispatch
    description: 无头入口明确拒绝 GUI 专属养成、装备与复活命令。
relations:
- from: character-care.growth
  type: part_of
  to: character-care
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.restoration
  type: part_of
  to: character-care
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.allocate
  type: part_of
  to: character-care.growth
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.equip
  type: part_of
  to: character-care.growth
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.recover
  type: part_of
  to: character-care.restoration
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.revive
  type: part_of
  to: character-care.restoration
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.bind
  type: part_of
  to: character-care
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.press
  type: part_of
  to: character-care
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.specified-growth
  type: part_of
  to: character-care
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.confirmation
  type: part_of
  to: character-care
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.support-boundary
  type: part_of
  to: character-care
  summary: 归属角色养成与恢复的相应责任。
- from: character-care.allocate
  type: invokes
  to: world-interaction.windows
  summary: 在已识别属性或技能窗口逐点分配。
- from: character-care.allocate
  type: invokes
  to: game-observation.observe
  summary: 读取剩余点数、属性及技能等级确认结果。
- from: character-care.equip
  type: invokes
  to: world-interaction.windows
  summary: 使用已确认的背包窗口操作装备。
- from: character-care.equip
  type: reads
  to: game-observation.facts
  summary: 比较装备背包和已装备槽位。
- from: character-care.recover
  type: invokes
  to: script-execution.run
  summary: 普通 200 类药品装载共享恢复 Lua 策略。
- from: character-care.recover
  type: invokes
  to: world-interaction.windows
  summary: 其他支持的 GUI 消费品使用背包窗口并处理收尾。
- from: character-care.recover
  type: invokes
  to: world-interaction.focus
  summary: GUI 用药前或收尾时按实际上下文恢复游戏焦点。
- from: character-care.recover
  type: invokes
  to: game-resources.lookup
  summary: 恢复目标类型与传送卷用途依赖已知静态物品资料。
- from: character-care.recover
  type: reads
  to: game-observation.facts
  summary: 核对本端角色、库存、HP/MP 及必要的转场结果。
- from: character-care.revive
  type: invokes
  to: game-observation.observe
  summary: 核对已识别确认框与同角色恢复状态。
- from: character-care.bind
  type: invokes
  to: world-interaction.windows
