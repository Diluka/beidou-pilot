- from: character-care.equip
  type: constrained_by
  to: character-care.confirmation
  summary: 指定物品须出现在已装备槽位。
- from: character-care.recover
  type: constrained_by
  to: character-care.confirmation
  summary: 每次消耗及所需效果均须核对。
- from: character-care.revive
  type: constrained_by
  to: character-care.confirmation
  summary: 一次确认后等待同角色恢复，未确认不重放。
- from: character-care
  type: constrained_by
  to: character-care.support-boundary
  summary: 按本端实际支持范围选择维护操作。
- from: character-care.recover
  type: constrained_by
  to: game-observation.truth
  summary: 库存或恢复事实未知时停止依赖这些事实的后续使用。
flows:
- id: character-care.allocate.flow
  name: 逐点执行并确认养成分配
  summary: 按指定目标逐点提交；未确认时保留已发生结果，停止后续分配。
  scenario: character-care.allocate
  startsAt: read
  steps:
  - id: read
    kind: action
    name: 读取指定目标与可用点数
    summary: 核对本次属性或技能、数量、当前角色与剩余点数。
    concept: character-care.allocate
  - id: eligible
    kind: decision
    name: 目标及点数是否可用
    summary: 检查点数足够、读数有效，技能分配还要求完整技能记录和可定位技能。
  - id: refuse
    kind: outcome
    name: 分配前拒绝
    summary: 缺少点数、读数或可确认目标，不继续分配。
  - id: point
    kind: action
    name: 在当前窗口分配一点
    summary: 使用已识别属性或技能窗口提交当前一点。
    concept: character-care.allocate
  - id: confirmed
    kind: decision
    name: 点数与目标值是否同时变化
    summary: 要求剩余点数减一且指定属性或技能等级加一。
    concept: character-care.confirmation
  - id: unknown
    kind: outcome
    name: 本点效果未确认
    summary: 返回已确认数量及实际读数，停止后续分配。
  - id: remaining
    kind: decision
    name: 本次指定数量是否完成
    summary: 仅在上一点已经双重确认后决定下一点。
  - id: done
    kind: outcome
    name: 指定分配已确认
    summary: 返回已分配数量及点数和目标值的前后变化。
  transitions:
  - from: read
    to: eligible
  - from: eligible
    to: refuse
    when: 条件缺失或点数不足
  - from: eligible
    to: point
    when: 目标与点数可用
  - from: point
    to: confirmed
  - from: confirmed
    to: unknown
    when: 任一变化未确认
  - from: confirmed
    to: remaining
    when: 点数和目标值同时符合预期
  - from: remaining
    to: point
    when: 仍有指定点数待分配
  - from: remaining
    to: done
    when: 指定数量全部确认
- id: character-care.recover.flow
  name: 使用恢复品并逐次核对
  summary: 按本端支持与目标选择执行路径；停止条件与效果未确认分别报告。
  scenario: character-care.recover
  startsAt: inspect
  steps:
  - id: inspect
    kind: action
    name: 读取角色库存和物品用途
    summary: 核对物品、数量、目标与预算；按目标恢复需要已知恢复类型。
    concept: character-care.recover
  - id: supported
    kind: decision
    name: 本次用途是否支持
    summary: 检查后端、物品类型、目标范围；传送卷仅接受单张且不接受 HP/MP 目标。
    concept: character-care.support-boundary
  - id: refused
    kind: outcome
    name: 使用前拒绝
    summary: 用途不支持或依赖的资料与读数缺失。
  - id: needed
    kind: decision
    name: 是否需要继续一次使用
    summary: 核对目标已达、资源已满、次数、库存与剩余预算。
  - id: done
    kind: outcome
    name: 返回实际停止原因
    summary: 目标已达、资源已满、次数完成、库存耗尽或预算结束。
  - id: method
    kind: decision
    name: 选择已支持的使用方式
    summary: 普通 200 类药品两端走共享 Lua，其他支持消费品走原版 GUI。
  - id: lua
    kind: action
    name: 原生 Lua 使用普通药品
    summary: 在当前角色身份和场景中派发一次普通用药。
    concept: script-execution.run
  - id: gui
    kind: action
    name: 背包使用支持的消费品
    summary: 使用当前确认槽位；传送卷只提交一次。
    concept: character-care.recover
  - id: confirmed
    kind: decision
    name: 消耗及所需效果是否确认
    summary: 库存须恰减一；按用途核对所需 HP/MP 增长或同角色地图、位置变化。
    concept: character-care.confirmation
  - id: unknown
    kind: outcome
    name: 效果未确认并停止
    summary: 保留消耗和状态事实，不重放已发生或未知的效果。
  - id: recheck
    kind: action
    name: 读取新状态再判断
    summary: 普通恢复重新核对是否仍需使用；已确认传送返回本次结果。
    concept: character-care.recover
  transitions:
  - from: inspect
    to: supported
  - from: supported
    to: refused
    when: 不支持或必要事实缺失
  - from: supported
    to: needed
    when: 本次用途与事实可用
  - from: needed
    to: done
    when: 已满足停止条件
  - from: needed
    to: method
    when: 仍需一次支持的使用
  - from: method
    to: lua
    when: 普通 200 类药品
  - from: method
    to: gui
    when: GUI 的其他已支持消费品
  - from: lua
    to: confirmed
  - from: gui
    to: confirmed
  - from: confirmed
    to: unknown
    when: 消耗或所需效果未确认
  - from: confirmed
    to: recheck
    when: 消耗与所需效果均确认
  - from: recheck
    to: needed
- id: character-care.revive.flow
  name: 一次确认并等待角色恢复
  summary: 存活跳过，死亡时仅操作已识别确认框，不重复提交。
  scenario: character-care.revive
  startsAt: read
  steps:
  - id: read
    kind: action
    name: 读取当前角色状态
    summary: 要求角色及其原生读数可用。
    concept: character-care.revive
  - id: alive
    kind: decision
    name: 角色是否存活
    summary: 检查当前 HP 是否为正。
  - id: skip
    kind: outcome
    name: 角色已存活
    summary: 无需复活，changed=false。
  - id: window
    kind: decision
    name: 死亡确认框能否唯一识别
    summary: 等待已识别窗口并核对唯一确认按钮和已验布局。
  - id: refused
    kind: outcome
    name: 未发送复活确认
    summary: 角色读数或确认窗口不能用于本次操作。
  - id: confirm
    kind: action
    name: 点击一次确认
    summary: 只向已识别复活窗口提交一次确认。
    concept: character-care.revive
  - id: restored
    kind: decision
    name: 同角色是否恢复
    summary: 在期限内核对同一角色 HP 为正且位置可用。
  - id: done
    kind: outcome
    name: 复活已确认
    summary: 返回恢复后的本端状态。
  - id: unknown
    kind: outcome
    name: 恢复未确认
    summary: 身份变化或恢复未确认时停止，不重复点击。
  transitions:
  - from: read
    to: alive
  - from: alive
    to: skip
    when: 角色存活
  - from: alive
    to: window
    when: 角色死亡
  - from: window
    to: refused
    when: 窗口或布局未确认
  - from: window
    to: confirm
    when: 唯一已识别确认框可用
  - from: confirm
    to: restored
  - from: restored
    to: done
    when: 同角色恢复已确认
  - from: restored
    to: unknown
    when: 身份变化或恢复未确认
