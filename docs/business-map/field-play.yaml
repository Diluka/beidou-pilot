schemaVersion: 1
map:
  id: field-play
  title: 动作意图与效果确认
  summary: tick 脚本通过共享 player 状态机提交方向与动作意图；动作受理、原生派发、输入释放和游戏效果分别确认，客户端不提供逐帧 Python 控制或内置打法。
nodes:
  - id: field-play
    kind: domain
    name: 动作意图与效果确认
    summary: 为操作者和 tick 脚本提供方向与动作意图提交，拥有输入槽保持、替换、撤下和动作效果边界；不承担寻路、选怪、自动战斗或完整玩法日程。
    aliases: [玩法控制, 动作槽, 有界玩法]
    anchors:
      - kind: document
        value: docs/LUA_TICK_API.md
        description: 动作槽、共享 player、运动观察与释放语义的公开参考。
      - kind: document
        value: docs/CONTROL.md
        description: 脚本执行、输入释放与游戏效果之间的契约。
  - id: field-play.primitive
    kind: operation
    name: 提交方向或动作意图
    summary: 通过 player.move/jump/attack/pickup/skill/use_item 写入持续输入意图；设置函数返回受理和原因，不表示原生动作已开始或游戏效果已发生。
    aliases: [move, jump, attack, pickup, skill, use_item, 语义动作]
    anchors:
      - kind: document
        value: docs/LUA_TICK_API.md
        description: 逐项动作参数、类型校验、返回值和原生准入边界。
      - kind: symbol
        file: shared/lua-runtime/TickRuntime.h
        value: TickAdapter::SetActionIntent
        description: 运行时向适配器提交当前动作意图的原生边界。
  - id: field-play.slot
    kind: invariant
    name: 单动作槽与共享 player
    summary: 同一客户端全部 tick 会话共享唯一 player，按接纳顺序调用、后写覆盖；动作忙时仍可替换或撤下意图，只保留当前槽，不形成历史后继队列。方向与动作分别保持。
    aliases: [共享玩家, 后写覆盖, 不排队, 替换意图]
    anchors:
      - kind: document
        value: docs/LUA_TICK_API.md
        description: 动作槽、替换/撤下和共享 player 的完整语义。
      - kind: file
        value: shared/lua-runtime/TickRuntime.cpp
        description: 会话草稿合并与共享 player 状态机实现。
  - id: field-play.motion
    kind: data
    name: 运动观察与静止参考
    summary: 实体各自提供 x/y/velocity；角色的 on_ground、attacking、action_idle 与 movement 参考模型按本端能力提供，未知保持未知。
    aliases: [velocity, on_ground, movement, 运动向量]
    anchors:
      - kind: document
        value: docs/LUA_TICK_API.md
        description: 运动向量来源、参考模型适用条件和未知语义。
  - id: field-play.release
    kind: invariant
    name: 会话所属输入释放
    summary: 完成、取消、期限、身份变化或错误只结束对应会话；清除该会话仍拥有的方向与动作输入，确认原生释放后发布终态，不清后来者的有效输入。
    aliases: [放键, control_released, 释放确认]
    anchors:
      - kind: document
        value: docs/CONTROL.md
        description: 取消、期限、身份变化与释放确认的协议边界。
      - kind: document
        value: docs/LUA_TICK_API.md
        description: 会话结束和动作槽撤下的公开语义。
  - id: field-play.effect
    kind: invariant
    name: 动作受理与游戏效果分别确认
    summary: 意图受理、原生派发、输入释放、动作收束与命中、消耗、恢复、拾取等效果分别判断；槽空或动画结束不证明持续输入已停止。
    aliases: [效果未知, dispatched, 不推断命中]
    anchors:
      - kind: document
        value: docs/CONTROL.md
        description: 动作结果各层事实的解释边界。
      - kind: document
        value: docs/LUA_TICK_API.md
        description: player.status 与只读领域可确认的事实范围。
  - id: field-play.action
    kind: scenario
    name: 运行一段 tick 动作脚本
    summary: 用户以 tick Lua 文件表达一组有界动作，由客户端按档位循环判断并保持意图；脚本自行决定何时设置、替换、撤下和结束，动作效果按现场事实确认。
    aliases: [tick 动作脚本, 动作循环, 手动动作]
    anchors:
      - kind: document
        value: docs/LUA_TICK_API.md
        description: 入口、档位、通道与动作槽语义。
      - kind: file
        value: shared/scripts/examples/tick-jump-attack.lua
        description: 按真实速度与落地事实推进的移动跳砍示例。
  - id: field-play.example
    kind: data
    name: tick 示例脚本
    summary: 随镜像固定的 tick 示例演示技能保持与撤下、助跑跳砍与落地停止；示例不寻路、不选怪，也不保证命中或精确出手次数。
    aliases: [tick-held-skill, tick-jump-attack, examples]
    anchors:
      - kind: file
        value: shared/scripts/examples/tick-held-skill.lua
        description: 只设置一次技能并撤下的持续输入示例。
      - kind: file
        value: shared/scripts/examples/tick-jump-attack.lua
        description: 按真实速度与落地事实推进的移动、跳跃和普攻示例。
      - kind: document
        value: shared/scripts/AGENTS.md
        description: 示例定位、未知事实边界与维护要求。
relations:
  - {from: field-play.primitive, type: part_of, to: field-play, summary: 动作意图提交是动作领域的核心操作。}
  - {from: field-play.slot, type: part_of, to: field-play, summary: 单动作槽与共享 player 决定意图如何保持和覆盖。}
  - {from: field-play.motion, type: part_of, to: field-play, summary: 运动事实与参考模型支撑脚本判断动作时机。}
  - {from: field-play.release, type: part_of, to: field-play, summary: 动作领域定义所属输入的释放与确认。}
  - {from: field-play.effect, type: part_of, to: field-play, summary: 动作领域限定受理与效果的区分。}
  - {from: field-play.action, type: part_of, to: field-play, summary: 一段 tick 脚本构成一次有界动作循环。}
  - {from: field-play.example, type: part_of, to: field-play, summary: 示例演示当前动作槽与观察能力。}
  - {from: field-play.action, type: invokes, to: field-play.primitive, summary: 动作循环通过 player 设置方向与动作意图。}
  - {from: field-play.action, type: invokes, to: script-execution.run, summary: 动作脚本以 tick 会话形式提交，不维护 Python 逐帧控制。}
  - {from: field-play.action, type: consumes, to: script-execution.strategy-entry, summary: 用户脚本以 main(context) 与 @option 接受调用参数。}
  - {from: field-play.action, type: publishes, to: script-execution.lua-api, summary: 脚本通过 tick 的 player 状态机写动作槽。}
  - {from: field-play.action, type: reads, to: game-observation.facts, summary: 设置动作前读取角色、场景、运动与动作事实。}
  - {from: field-play.primitive, type: constrained_by, to: field-play.slot, summary: 设置动作遵守单动作槽与共享 player 规则。}
  - {from: field-play.release, type: constrained_by, to: client-session.identity, summary: 释放只作用于所属会话和当前原生实例。}
  - {from: field-play.release, type: constrained_by, to: script-execution.effect-boundary, summary: 所属输入释放不等于动画停止或游戏效果完成。}
  - {from: field-play.effect, type: constrained_by, to: script-execution.effect-boundary, summary: 效果判断沿用执行领域的终态/效果区分。}
  - {from: field-play.example, type: constrained_by, to: field-play.effect, summary: 示例不把派发、槽空或动画结束当作命中。}
flows:
  - id: field-play.action.flow
    name: 从意图设置到释放确认
    summary: 脚本只在已受理的 tick 会话内循环写动作槽；原生派发、角色动作和游戏效果分别观察，会话结束时按所属输入释放。
    scenario: field-play.action
    startsAt: observe
    steps:
      - {id: observe, kind: action, name: 读取当前动作与场景事实, summary: 检查角色、地面、速度、动作锁和所需静态事实。, concept: game-observation.observe}
      - {id: ready, kind: decision, name: 前提是否满足, summary: 会话已受理且所需事实已知才继续；未知只阻断依赖该事实的操作。}
      - {id: refused, kind: outcome, name: 保留未知或未支持, summary: 不猜测缺失事实，也不以动作受理替代前提确认。}
      - {id: set, kind: action, name: 写入方向或动作意图, summary: player 设置仅把草稿放入本 tick，重复设置幂等，替换或撤下只改当前槽。, concept: field-play.primitive}
      - {id: commit, kind: decision, name: 入口如何返回, summary: 正常返回后统一提交差异；入口返回 done 或错误则结束会话。}
      - {id: dispatch, kind: action, name: 原生消费者处理输入, summary: 原生按动作完成、准入和重复节奏决定派发、保持或拒绝，不按 Lua 调用频率重放。, concept: field-play.slot}
      - {id: inspect, kind: action, name: 读取派发与角色动作事实, summary: 区分 input_* 意图、action 已开始动作、busy/phase 和 reason/effect。, concept: field-play.effect}
      - {id: effect, kind: decision, name: 本次会话是否继续, summary: 继续时回到观察；结束由完成、取消、期限、身份变化或错误决定。}
      - {id: ending, kind: action, name: 清除并确认所属输入, summary: 停止该会话仍拥有的方向与动作输入，由 Runtime 确认真实释放。, concept: field-play.release}
      - {id: released, kind: outcome, name: 会话终态与释放事实, summary: 返回 completed/cancelled 及 control_released；命中、消耗和恢复等效果另行核对。}
    transitions:
      - {from: observe, to: ready}
      - {from: ready, to: set, when: 事实已知且会话可写草稿}
      - {from: ready, to: refused, when: 事实未知或能力不支持}
      - {from: set, to: commit}
      - {from: commit, to: dispatch, when: 入口正常返回且草稿有效}
      - {from: commit, to: ending, when: 入口返回 done 或脚本错误}
      - {from: dispatch, to: inspect}
      - {from: inspect, to: effect}
      - {from: effect, to: observe, when: 会话继续并按档位再次判断}
      - {from: effect, to: ending, when: 完成取消期限或异常结束}
      - {from: ending, to: released}
