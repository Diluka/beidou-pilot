  - {from: game-ai.collaborate, type: reads, to: game-ai.questions, summary: 回答必须匹配当前挂起询问。}
  - {from: game-ai.collaborate, type: writes, to: game-ai.questions, summary: 登记并完成当前模型询问。}
  - {from: game-ai.collaborate, type: publishes, to: game-ai.developer-channel, summary: 发布问题、状态和命令结果并接受专用协作。}
flows:
  - id: game-ai.start.flow
    name: 建立或续接隔离游戏会话
    summary: 验证隔离、模型和客户端绑定，按已有 checkpoint 新建或续接专用 thread。
    scenario: game-ai.start
    startsAt: inspect
    steps:
      - {id: inspect, kind: action, name: 核对隔离环境与模型清单, summary: 检查实际工具配置和当前身份可用模型，选择支持的 effort。, concept: game-ai.start}
      - {id: allowed, kind: decision, name: 启动条件是否满足, summary: 额外技能或 MCP、无效裁剪和模型不可用均阻止启动。, concept: game-ai.isolation}
      - {id: saved, kind: decision, name: 是否存在会话检查点, summary: 已有 checkpoint 提供需要续接的 thread 和固定客户端选择。, concept: game-ai.checkpoint}
      - {id: binding, kind: decision, name: 旧会话是否匹配本次客户端选择, summary: CLI、运行根、后端、实例名和只读模式必须相同。, concept: game-ai.binding}
      - {id: create, kind: action, name: 新建专用游戏 thread, summary: 传入本次角色约束和有限游戏工具，不允许模型回退。, concept: game-ai.start}
      - {id: resume, kind: action, name: 续接既有游戏 thread, summary: 使用旧 thread 身份并传入本次角色与启动选择。, concept: game-ai.start}
      - {id: instructions, kind: decision, name: 会话是否只加载授权指令, summary: 返回额外指令来源时拒绝会话。, concept: game-ai.isolation}
      - {id: ready, kind: outcome, name: 专用会话就绪, summary: 保存检查点，按启动选择开始任务或等待恢复。, concept: game-ai.session}
      - {id: refused, kind: outcome, name: 启动或续接被拒绝, summary: 保留隔离、模型或绑定失败事实，不换用其他模型或客户端。}
    transitions:
      - {from: inspect, to: allowed}
      - {from: allowed, to: saved, when: 条件满足}
      - {from: allowed, to: refused, when: 隔离或模型条件不满足}
      - {from: saved, to: binding, when: 存在检查点}
      - {from: saved, to: create, when: 不存在检查点}
      - {from: binding, to: resume, when: 客户端选择一致}
      - {from: binding, to: refused, when: 客户端选择变化}
      - {from: create, to: instructions}
      - {from: resume, to: instructions}
      - {from: instructions, to: ready, when: 未加载额外指令}
      - {from: instructions, to: refused, when: 加载了额外指令}
  - id: game-ai.play.flow
    name: 观察、执行并回送决策结果
    summary: 模型消费新鲜观察并按需执行有界 Lua，执行完成后重新判断效果，拒绝越过当前控制边界。
    scenario: game-ai.play
    startsAt: observe
    steps:
      - {id: observe, kind: action, name: 读取所属实例的新鲜观察, summary: 先查运行状态；未运行时返回事实，不自动打开客户端。, concept: game-observation.observe}
      - {id: decide, kind: decision, name: 本轮需要哪类后续行动, summary: 模型依据角色约束、当前目标和观察决定继续交流或请求 Lua。, concept: game-ai.play}
      - {id: report, kind: outcome, name: 返回观察结论或等待协助, summary: 可以报告事实或经专用通道询问，不要求每轮都执行动作。, concept: game-ai.collaborate}
      - {id: permitted, kind: decision, name: Lua 请求是否符合当前控制边界, summary: 只读、暂停、无效时限或已有活动 Lua 时拒绝派发。, concept: game-ai.dispatch}
      - {id: rejected, kind: outcome, name: 动作请求被拒绝, summary: 返回明确原因，不绕过只读、暂停或并发限制。}
      - {id: run, kind: action, name: 派发有界 Lua 并等待结果, summary: 核对运行身份，委托既有 CLI 执行并保留实际完成或失败事实。, concept: script-execution.run}
      - {id: safe, kind: decision, name: 当前会话是否仍可继续决策, summary: 身份变化或放键未确认进入 error；执行期间暂停或停止时不发起后续 turn。, concept: game-ai.binding}
      - {id: failed, kind: outcome, name: 停止继续派发并保留失败, summary: 不把后继实例或未知持键状态当作正常完成。}
      - {id: held, kind: outcome, name: 保持暂停或停止状态, summary: 不因 Lua 完成自动恢复玩法控制。, concept: game-ai.control}
      - {id: continue, kind: action, name: 把执行结果回送同一模型会话, summary: 要求重新观察和核对效果，再按当前任务决定下一步。, concept: game-ai.play}
      - {id: delivered, kind: decision, name: 后续模型输入是否成功送达, summary: 回送失败时保留执行结果，进入 error 并通知控制器结束本次控制。, concept: game-ai.play}
      - {id: returned, kind: outcome, name: 进入后续效果判断, summary: Lua 完成或普通失败均保留原结果，不直接宣告游戏目标成功。}
    transitions:
      - {from: observe, to: decide}
      - {from: decide, to: report, when: 报告事实或请求协助}
      - {from: decide, to: permitted, when: 请求有界 Lua}
      - {from: permitted, to: run, when: 允许派发}
      - {from: permitted, to: rejected, when: 当前控制边界不允许}
      - {from: run, to: safe}
      - {from: safe, to: failed, when: 身份变化或释放未确认}
      - {from: safe, to: held, when: 已暂停或停止}
      - {from: safe, to: continue, when: 仍处于可运行状态}
      - {from: continue, to: delivered}
      - {from: delivered, to: returned, when: 后续输入已送达}
      - {from: delivered, to: failed, when: 回送模型输入失败}
  - id: game-ai.control.flow
    name: 释放控制后暂停、恢复或停止
    summary: 区分只读与持有游戏控制的会话，确认放键后完成暂停或停止，恢复时重新观察。
    scenario: game-ai.control
    startsAt: command
    steps:
      - {id: command, kind: decision, name: 请求何种玩法控制, summary: resume 只接受已确认暂停的会话，其余请求进入暂停或停止流程。, concept: game-ai.control}
      - {id: paused, kind: decision, name: 是否已确认暂停, summary: 未处于 paused 的会话拒绝恢复。, concept: game-ai.session}
      - {id: invalid, kind: outcome, name: 拒绝恢复, summary: 当前状态不满足恢复条件，保留原控制状态。}
      - {id: observe, kind: action, name: 重新观察并规划, summary: 读取当前事实与排队消息，不恢复已取消的 Lua。, concept: game-observation.observe}
      - {id: resumed, kind: outcome, name: 按当前任务继续决策, summary: 恢复同一游戏 thread 的模型 turn，不重放旧动作。, concept: game-ai.play}
      - {id: block, kind: action, name: 阻止新动作并中断当前模型, summary: 进入 pausing 或 stopping，等待已受理的模型输入取得身份后中断。, concept: game-ai.control}
      - {id: readonly, kind: decision, name: 是否为只读会话, summary: 只读会话不调用游戏取消，避免影响当前操作者。, concept: game-ai.read-only}
      - {id: cancel, kind: action, name: 取消所属原脚本并核对放键, summary: 向原 CLI 发信号并等待，同一运行身份下确认脚本、命令和持键已释放。, concept: script-execution.cancel}
      - {id: released, kind: decision, name: 是否确认所属输入已释放, summary: 取消失败、身份变化或仍有持键不能报告成功。, concept: game-ai.binding}
      - {id: error, kind: outcome, name: 保留释放失败并进入错误状态, summary: 不交接尚未确认释放的角色控制。}
      - {id: finish, kind: decision, name: 完成暂停还是停止, summary: 确认控制边界后按请求进入 paused 或 stopped。, concept: game-ai.control}
      - {id: waiting, kind: outcome, name: 已暂停并可交接控制, summary: 阻止新动作，后续 resume 必须重新观察。, concept: game-ai.session}
      - {id: stopped, kind: outcome, name: 游戏 AI 停止而客户端保留, summary: 结束本次 harness，客户端按实例域的独立生命周期继续存在。, concept: game-ai.session}
    transitions:
      - {from: command, to: paused, when: 请求恢复}
      - {from: command, to: block, when: 请求暂停或停止}
      - {from: paused, to: observe, when: 已确认暂停}
      - {from: paused, to: invalid, when: 尚未确认暂停}
      - {from: observe, to: resumed}
      - {from: block, to: readonly}
      - {from: readonly, to: finish, when: 只读会话}
      - {from: readonly, to: cancel, when: 有游戏控制权的会话}
      - {from: cancel, to: released}
      - {from: released, to: finish, when: 已确认放键}
      - {from: released, to: error, when: 释放失败或无法确认}
      - {from: finish, to: waiting, when: 请求暂停}
      - {from: finish, to: stopped, when: 请求停止}
