schemaVersion: 1
map:
  id: game-resources
  title: 外部资源与静态资料
  summary: 从外部只读客户端准备运行资源，并向观察和策略提供有来源的本地静态资料。
nodes:
  - id: game-resources
    kind: domain
    name: 外部资源与静态资料
    summary: 拥有外部资源路径、无头NX转换产物、GUI运行副本和WZ XML查询；不拥有外部客户端原件及在线游戏事实。
    aliases: [资源准备, 资源转换, 静态资料]
    anchors:
      - kind: document
        value: docs/ARCHITECTURE.md
        description: 说明外部资源配置、metadata-only NX与GUI只读挂载边界。
  - id: game-resources.prepare
    kind: scenario
    name: 准备无头元数据资源
    summary: 显式指定外部客户端，在原件目录外转换或核验复用NX类别并生成来源清单。
    aliases: [IMG转NX, 资源转换, prepare_resources]
    anchors:
      - kind: symbol
        file: headless/tools/prepare_resources.py
        value: main
        description: 核验输入输出位置，转换IMG类别或校验既有产物，再记录输入、转换器及输出哈希。
  - id: game-resources.lookup
    kind: operation
    name: 查询本地静态资料
    summary: 查询WZ XML中的地图、NPC、怪物、物品名称和地形信息；缺失资料保留未知，损坏资料明确报错。
    aliases: [名称查询, 地形资料, Catalog]
    anchors:
      - kind: symbol
        file: cli/beidou_pilot/catalog.py
        value: Catalog
        description: 从本地WZ XML提供名称、地图几何、NPC和物品资料，不读取服务端状态。
      - kind: symbol
        file: cli/beidou_pilot/catalog.py
        value: Catalog._xml
        description: 区分资料不存在与资料无法解析，不为缺失XML构造事实。
  - id: game-resources.catalog
    kind: data
    name: 本地WZ静态资料
    summary: 由可选metadata_root定位的名称、分类、属性与几何资料；描述客户端素材，不代表当前游戏现场。
    aliases: [WZ XML, metadata_root, 静态目录]
    anchors:
      - kind: file
        value: cli/beidou_pilot/catalog.py
        description: 定义本地静态资料的读取、查询及来源投影。
  - id: game-resources.readonly
    kind: invariant
    name: 外部客户端原件保持只读
    summary: 转换输出和GUI运行副本必须位于原客户端目录之外；镜像与源码不包含游戏素材、私密profile或运行数据。
    aliases: [原件保护, 外部只读资源]
    anchors:
      - kind: symbol
        file: headless/tools/prepare_resources.py
        value: main
        description: 拒绝将转换输出写入原客户端目录及其子目录。
      - kind: file
        value: docker/gui/prepare-client.sh
        description: 在原件之外复制运行文件并只替换运行副本的桥DLL。
      - kind: document
        value: AGENTS.md
        description: 规定外部资源、账号和运行状态不进入源码或镜像。
  - id: game-resources.configure
    kind: operation
    name: 解析外部资源配置
    summary: 从指定资源配置或本项目默认位置解析路径，相对路径以配置文件目录为基准，拒绝未知字段和无效配置。
    aliases: [load_resources, MAPLE_RESOURCES_CONFIG]
    anchors:
      - kind: symbol
        file: cli/beidou_pilot/resources.py
        value: load_resources
        description: 统一解析metadata_root、headless_resources、gui_client和gui_dll，不扫描其他工作区。
  - id: game-resources.config
    kind: data
    name: 外部资源路径配置
    summary: 本机配置将四类资源路径与消费者关联；配置不含账号，实际resources.json不入库。
    aliases: [resources.json, ResourcePaths, 资源路径]
    anchors:
      - kind: symbol
        file: cli/beidou_pilot/resources.py
        value: ResourcePaths
        description: 声明静态资料、无头资源、GUI原件和桥DLL路径。
      - kind: file
        value: cli/config/resources.example.json
        description: 提供无私密内容的资源配置格式示例。
  - id: game-resources.check
    kind: operation
    name: 离线检查无头资源
    summary: 通过无网络短时容器只读挂载资源，验证无头客户端能否读取，不登录游戏。
    aliases: [agent check, NX检查]
    anchors:
      - kind: file
        value: headless/agent
        description: 只支持check入口，以network none和只读资源挂载启动检查容器。
  - id: game-resources.nx
    kind: data
    name: 无头NX产物与来源清单
    summary: 按类别保存NX和manifest，记录输入树、转换器和产物哈希及节点统计，供运行或一致性复用核验。
    aliases: [metadata-only NX, manifest, headless_resources]
    anchors:
      - kind: file
        value: headless/tools/prepare_resources.py
        description: 定义NX类别输出和manifest的内容及一致性核验。
  - id: game-resources.metadata-limit
    kind: invariant
    name: 元数据不补造画面与在线事实
    summary: NX保留玩法属性、帧时序和几何，不含可绘制像素或可播放音频；WZ XML缺失不由服务端或其他后端补齐。
    aliases: [metadata-only, 未知资料]
    anchors:
      - kind: document
        value: docs/ARCHITECTURE.md
        description: 声明元数据资源、可选XML和事实补齐的支持边界。
      - kind: symbol
        file: headless/tools/prepare_resources.py
        value: main
        description: 在manifest声明metadata_only、renderable_pixels和playable_audio。
  - id: game-resources.gui-copy
    kind: scenario
    name: 装配GUI运行副本
    summary: 在容器私有目录复制运行文件、链接只读Data并替换所选桥DLL，保留外部原客户端不变。
    aliases: [原版客户端副本, GUI资源装配]
    anchors:
      - kind: file
        value: docker/gui/prepare-client.sh
        description: 校验输入与输出，独立复制运行文件并替换副本中的ijl15.dll。
      - kind: file
        value: docker/compose.yaml
        description: 将外部原客户端与桥DLL以只读方式挂入GUI容器。
      - kind: file
        value: cli/test/test_portability.py
        description: 合同覆盖运行副本更改不会修改原件。
relations:
  - {from: game-resources.prepare, type: part_of, to: game-resources, summary: NX转换建立本域的无头运行资源。}
  - {from: game-resources.lookup, type: part_of, to: game-resources, summary: 静态资料查询由资源域提供。}
  - {from: game-resources.catalog, type: part_of, to: game-resources, summary: 静态目录归资源域管理其读取语义。}
  - {from: game-resources.readonly, type: part_of, to: game-resources, summary: 原件保护约束所有资源准备。}
  - {from: game-resources.configure, type: part_of, to: game-resources, summary: 资源配置解析建立外部路径关联。}
  - {from: game-resources.config, type: part_of, to: game-resources, summary: 四类路径配置属于资源责任。}
  - {from: game-resources.check, type: part_of, to: game-resources, summary: 离线检查验证准备后的无头资源。}
  - {from: game-resources.nx, type: part_of, to: game-resources, summary: NX与来源清单由转换流程产生。}
  - {from: game-resources.metadata-limit, type: part_of, to: game-resources, summary: 元数据边界界定可消费资料的意义。}
  - {from: game-resources.gui-copy, type: part_of, to: game-resources, summary: GUI副本装配是同一原件保护责任的另一场景。}
  - {from: game-resources.prepare, type: writes, to: game-resources.nx, summary: 转换生成类别NX及来源清单。}
  - {from: game-resources.prepare, type: reads, to: game-resources.nx, summary: 复用既有产物前核验输入、转换器和输出哈希。}
  - {from: game-resources.prepare, type: constrained_by, to: game-resources.readonly, summary: 转换必须写到原件之外。}
  - {from: game-resources.prepare, type: constrained_by, to: game-resources.metadata-limit, summary: 转换只承诺元数据用途。}
  - {from: game-resources.lookup, type: invokes, to: game-resources.configure, summary: 静态查询通过统一配置确定资料根目录。}
  - {from: game-resources.lookup, type: reads, to: game-resources.catalog, summary: 查询读取本地XML资料。}
  - {from: game-resources.lookup, type: constrained_by, to: game-resources.metadata-limit, summary: 缺失资料保留未知且不作为现场事实。}
  - {from: game-resources.configure, type: reads, to: game-resources.config, summary: 按配置文件所在目录解析外部资源路径。}
  - {from: game-resources.check, type: reads, to: game-resources.nx, summary: 资源检查只读消费NX，不登录游戏。}
  - {from: game-resources.gui-copy, type: reads, to: game-resources.config, summary: GUI装配消费已选原客户端和桥DLL路径。}
  - {from: game-resources.gui-copy, type: constrained_by, to: game-resources.readonly, summary: 运行副本的配置和DLL变更不写回原客户端。}
flows:
  - id: game-resources.prepare.flow
    name: 转换或复用无头NX
    summary: 保护外部原件，并以输入和产物一致性决定是否复用已存在的转换结果。
    scenario: game-resources.prepare
    startsAt: input
    steps:
      - {id: input, kind: action, name: 指定外部客户端与输出目录, summary: 显式提供client-root，定位Data及原件之外的输出。, concept: game-resources.prepare}
      - {id: valid, kind: decision, name: 输入与输出是否有效, summary: Data必须存在，输出不能等于或位于原客户端目录内。}
      - {id: existing, kind: decision, name: 类别NX是否已经存在, summary: 按选定类别检查待产出的NX。}
      - {id: reuse, kind: decision, name: 是否允许一致性复用, summary: 需要显式reuse-existing、既有manifest及匹配的输入树、转换器和产物哈希。}
      - {id: convert, kind: action, name: 转换新类别, summary: 只读输入IMG，完成临时NX后生成类别产物。, concept: game-resources.prepare}
      - {id: manifest, kind: action, name: 记录来源与元数据边界, summary: 写入选定类别的来源、哈希、统计及metadata-only声明。, concept: game-resources.prepare}
      - {id: prepared, kind: outcome, name: 元数据资源已准备, summary: 选定类别的NX和清单可供后续离线检查及运行消费。}
      - {id: refused, kind: outcome, name: 拒绝准备或复用, summary: 报告输入输出或一致性问题，不覆盖不匹配产物和外部原件。}
    transitions:
      - {from: input, to: valid}
      - {from: valid, to: existing, when: 输入输出通过核验}
      - {from: valid, to: refused, when: 缺少Data或输出侵入原件}
      - {from: existing, to: convert, when: 类别产物不存在}
      - {from: existing, to: reuse, when: 类别产物已存在}
      - {from: reuse, to: manifest, when: 显式复用且全部哈希一致}
      - {from: reuse, to: refused, when: 未授权复用或一致性不符}
      - {from: convert, to: manifest}
      - {from: manifest, to: prepared}
  - id: game-resources.gui-copy.flow
    name: 装配原件之外的GUI副本
    summary: 保留原客户端和Data，只在独立运行副本替换桥DLL与运行配置。
    scenario: game-resources.gui-copy
    startsAt: select
    steps:
      - {id: select, kind: action, name: 选择原客户端与桥DLL, summary: 从外置路径取得原客户端、所选DLL和独立输出位置。, concept: game-resources.gui-copy}
      - {id: valid, kind: decision, name: 是否满足装配条件, summary: 必需运行文件和Data存在，输出在原件之外且尚未存在。}
      - {id: copy, kind: action, name: 建立独立运行副本, summary: 复制运行文件、链接只读Data并将所选桥DLL写入副本。, concept: game-resources.gui-copy}
      - {id: ready, kind: outcome, name: GUI副本可供启动, summary: 运行配置与桥DLL可在副本使用，外部原件保持原状。}
      - {id: refused, kind: outcome, name: 装配被拒绝, summary: 报告缺失文件或输出位置问题，不修改原客户端。}
    transitions:
      - {from: select, to: valid}
      - {from: valid, to: copy, when: 输入完整且输出位置可用}
      - {from: valid, to: refused, when: 输入缺失或输出位置不可用}
      - {from: copy, to: ready}
