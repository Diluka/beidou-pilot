name: Agent bridge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-bridge:
    name: Windows bridge build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Build Win32 bridge
        shell: pwsh
        run: ./beidou-ijl15/tools/build-agent-bridge.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maple-agent-bridge-win32
          path: beidou-ijl15/out/agent-bridge/
          if-no-files-found: error
