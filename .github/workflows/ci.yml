name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Run offline tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=cli python3 -m unittest discover -s cli/test -t cli -v

  headless-image:
    name: Headless image build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Build headless image
        run: docker build --file docker/headless/Dockerfile --tag local/beidou-pilot:ci .
      - name: Run the packaged CLI as its runtime user
        run: |
          docker run --rm --network none --read-only --entrypoint beidou-pilot local/beidou-pilot:ci --help
          docker run --rm --network none --read-only --entrypoint beidou-pilot local/beidou-pilot:ci --version

  game-ai-harness:
    name: Game AI harness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Build isolated Codex image
        run: docker build --tag local/beidou-game-ai:ci docker/harness
      - name: Install existing-session event consumer dependency
        run: python3 -m pip install --requirement harness/requirements-events.txt
      - name: Run harness contracts without authentication or a real model
        env:
          BEIDOU_GAME_AI_IMAGE: local/beidou-game-ai:ci
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: harness
        run: |
          mkdir -p tmp/harness-ci
          TMPDIR="$GITHUB_WORKSPACE/tmp/harness-ci" python3 -m unittest discover -s harness/test -v
